<!--
  @file Patient Queue Status View
  Purpose: Real-time lookup of queue position, estimated call time, and assigned doctor room.
  SRS Requirements: FR-2.3 (Queue Status & Wait Time), BR-5 (Dynamic ETA Display)
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="nav.status">Queue Status</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="container">
        <nav class="app-nav">
          <h1>
            <a
              href="/index.html"
              style="text-decoration: none; color: inherit"
              data-i18n="app.title"
            ></a>
          </h1>
          <ul class="nav-links">
            <li><a href="/index.html" data-i18n="nav.home"></a></li>
            <li><a href="/book.html" data-i18n="nav.book"></a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <div class="card">
        <h2 data-i18n="nav.status" style="margin-bottom: 1.5rem"></h2>
        <form id="status-search-form" style="display: flex; gap: 0.5rem; margin-bottom: 2rem">
          <input
            type="text"
            id="booking-ref-input"
            class="form-input"
            data-i18n-placeholder="status.inputPlaceholder"
            required
          />
          <button type="submit" class="btn btn-primary" data-i18n="status.checkButton"></button>
        </form>
        <div id="status-result" class="card" style="display: none">
          <div class="token-display" id="token-display-value">---</div>
          <p>
            <strong data-i18n="status.currentQueuePosition"></strong>:
            <span id="queue-position-val"></span>
          </p>
          <p><strong data-i18n="status.estimatedCallTime"></strong>: <span id="eta-val"></span></p>
        </div>
      </div>
    </main>

    <script type="module" src="/js/pages/status.page.js"></script>
  </body>
</html>
